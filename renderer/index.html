<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Claude 사용량</title>
<style>
  /* 기본 막대색은 hiworks 위젯과 같은 노란색 QColor(255, 220, 80).
     한도에 가까워지면 주황 → 붉은 주황으로 단계를 올린다. */
  :root {
    --yellow: #FFDC50;
    --warn: #FFA23D;
    --danger: #FF6242;
    --bar: var(--yellow);
    --blue: #00A2E8;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    user-select: none;
    cursor: default;
  }

  body { display: flex; }

  /* hiworks 위젯과 같은 반투명 배경판: 검정 10%, 모서리 반경 10
     (QColor(0, 0, 0, 26) / addRoundedRect(..., 10, 10))

     배경을 body에 주면 안 된다. 루트(html)의 배경이 투명하면 브라우저가
     body의 배경을 문서 캔버스로 승격시켜 창 전체를 칠하는데, 이때
     border-radius는 따라가지 않아 모서리가 각지게 나온다. */
  .panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    background: rgba(0, 0, 0, .1);
    border-radius: 10px;
  }

  /* 바깥 테두리와 안쪽 채움이 분리된 알약 모양.
     그림자는 filter: drop-shadow() 대신 box-shadow를 쓴다. 투명 창에서
     filter는 별도 합성 레이어를 만들어 자식 요소가 비쳐 보이는 문제가 있다. */
  .bar {
    width: 100px;
    height: 15px;
    border: 2px solid var(--bar);
    border-radius: 8px;
    padding: 2px;
    box-shadow: 1px 1px 0 rgba(0, 0, 0, .63);
  }

  .fill {
    width: 0%;
    height: 100%;
    background: var(--bar);
    border-radius: 4px;
  }

  .time {
    font: 600 17px/1 "Segoe UI", system-ui, sans-serif;
    font-variant-numeric: tabular-nums;
    letter-spacing: 1px;
    color: var(--blue);
    /* hiworks와 동일: 블러 없이 오른쪽 아래 1px, 검정 알파 160/255
       (drawText(x + 1, y + 1) + QColor(0, 0, 0, 160)) */
    text-shadow: 1px 1px 0 rgba(0, 0, 0, .63);
  }

  /* 로그인 필요/오류처럼 값이 없는 상태 */
  .time.muted {
    font-size: 11px;
    letter-spacing: 0;
    opacity: .8;
  }
</style>
</head>
<body>
  <div class="panel">
    <div class="bar"><div class="fill" id="fill"></div></div>
    <div class="time" id="time">--:--</div>
  </div>

<script>
  const fillEl = document.getElementById('fill');
  const timeEl = document.getElementById('time');

  function hhmm(ms) {
    const d = new Date(ms);
    return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }

  function setMuted(text) {
    timeEl.textContent = text;
    timeEl.classList.add('muted');
  }

  // 갱신 주기와 같은 경계(80 / 90)를 쓴다.
  function setBarColor(percent) {
    const token = percent >= 90 ? '--danger' : percent >= 80 ? '--warn' : '--yellow';
    document.documentElement.style.setProperty('--bar', `var(${token})`);
  }

  window.widget.onUsage((d) => {
    if (d.state !== 'ok') {
      fillEl.style.width = '0%';
      setBarColor(0);
      setMuted(d.state === 'need-login' ? '로그인 필요' : '조회 실패');
      return;
    }

    const pct = Math.max(0, Math.min(100, d.percent));
    fillEl.style.width = pct + '%';
    setBarColor(d.percent);

    if (d.resetsAt) {
      timeEl.classList.remove('muted');
      timeEl.textContent = hhmm(d.resetsAt);
    } else if (pct === 0) {
      // 창을 연 적이 없으면 초기화 시각도 없다. 고장과 구분되게 적어준다.
      setMuted('사용 없음');
    } else {
      // 사용량은 있는데 초기화 시각만 없는 경우. 비워두지 말고 수치라도 보인다.
      setMuted(Math.round(pct) + '%');
    }
  });

  // 우클릭 메뉴
  window.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    window.widget.menu();
  });

  // 더블클릭으로 즉시 새로고침
  window.addEventListener('dblclick', () => window.widget.refresh());

  // 창 이동. 포인터 캡처를 잡아야 창 밖으로 커서가 나가도 드래그가 끊기지 않는다.
  const root = document.documentElement;
  let dragging = false;
  let startX = 0;
  let startY = 0;

  root.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    dragging = true;
    startX = e.screenX;
    startY = e.screenY;
    root.setPointerCapture(e.pointerId);
    window.widget.dragStart();
  });

  root.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    window.widget.dragMove(e.screenX - startX, e.screenY - startY);
  });

  root.addEventListener('pointerup', (e) => {
    if (!dragging) return;
    dragging = false;
    root.releasePointerCapture(e.pointerId);
    window.widget.dragEnd();
  });
</script>
</body>
</html>
